<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex — pokegen dataset</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3Cpath d='M4 50h92' stroke='%23111' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>Pokédex</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="ghost" id="random">Random</button>
    <div class="seg" id="viewtoggle" role="group" aria-label="Image type">
      <button data-view="artwork" class="active">Artwork</button>
      <button data-view="sprites">Sprites</button>
      <button data-view="generated">Generated</button>
    </div>
  </div>
  <div class="bar controls">
    <input id="search" type="search" placeholder="Search name or #id    /" autocomplete="off" spellcheck="false">
    <select id="gen" aria-label="Generation"></select>
    <select id="sort" aria-label="Sort">
      <option value="id-asc"># ascending</option>
      <option value="id-desc"># descending</option>
      <option value="name-asc">Name A → Z</option>
      <option value="name-desc">Name Z → A</option>
    </select>
    <button class="ghost" id="clear">Clear filters</button>
    <button class="ghost" id="regen" hidden>Copy generate command</button>
  </div>
  <div class="types" id="types"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No Pokémon match your filters.</p>
</main>

<div class="modal" id="modal" hidden>
  <div class="backdrop" data-close></div>
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Pokémon details"></div>
</div>

<script src="app.js"></script>
</body>
</html>
